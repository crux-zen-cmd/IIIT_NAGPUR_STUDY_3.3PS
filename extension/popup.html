<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttentionAI</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1322;
      color: #e8edf5;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .session-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8899bb;
    }

    .dot.active {
      background: #22d67a;
      box-shadow: 0 0 8px #22d67a;
    }

    .course-name {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .platform-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      background: rgba(167, 139, 250, 0.2);
      color: #a78bfa;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .btn-dashboard {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px;
      background: linear-gradient(135deg, #6ee7f7, #a78bfa);
      color: #080c14;
      font-weight: 700;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="header">
    <span style="font-size: 18px;">🧠</span>
    <span class="brand-title">AttentionAI Study Tracker</span>
  </div>
  <div class="session-status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking session...</span>
  </div>
  <div class="course-name" id="courseName">—</div>
  <div class="platform-pill" id="platformPill">Platform</div>
  <a class="btn-dashboard" id="btnDashboard" href="http://localhost:5050" target="_blank">Open Dashboard</a>
  <script src="popup.js"></script>
</body>

</html>
