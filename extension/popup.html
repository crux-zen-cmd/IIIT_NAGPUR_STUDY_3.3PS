<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AttentionAI</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.12);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand-title {
      font-size: 14px;
      font-weight: 800;
      color: #60a5fa;
    }
    .session-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 8px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .dot.active {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .course-name {
      font-size: 13px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .platform-pill {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      background: rgba(37, 99, 235, 0.25);
      color: #93c5fd;
      border-radius: 4px;
    }
    .tab-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border-radius: 4px;
    }
    .btn-dashboard {
      display: block;
      width: 100%;
      text-align: center;
      padding: 8px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.15s ease;
    }
    .btn-dashboard:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 18px;">🧠</span>
    <span class="brand-title">AttentionAI Study Tracker</span>
  </div>
  <div class="session-status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Checking session...</span>
  </div>
  <div class="course-name" id="courseName">—</div>
  <div class="meta-row">
    <span class="platform-pill" id="platformPill">Platform</span>
    <span class="tab-badge" id="tabSwitchBadge">🔀 0 Tab Switches</span>
  </div>
  <a class="btn-dashboard" id="btnDashboard" href="http://127.0.0.1:5050" target="_blank">Open Dashboard</a>
  <script src="popup.js"></script>
</body>
</html>
